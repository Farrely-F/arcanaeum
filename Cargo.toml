[package]
name = "arcanaeum"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A fast, comfortable markdown reader for the terminal, with themes"
license = "MIT"
repository = "https://github.com/Farrely-F/arcanaeum"
homepage = "https://github.com/Farrely-F/arcanaeum"
readme = "README.md"
keywords = ["markdown", "tui", "terminal", "reader", "viewer"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "arca"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
notify = "8"
pulldown-cmark = "0.13"
ratatui = "0.30"
# Pure-Rust regex engine: no C toolchain needed to build on other machines.
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
